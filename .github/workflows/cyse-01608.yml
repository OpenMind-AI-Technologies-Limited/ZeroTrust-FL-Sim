name: CYSE-01608 independent reproducibility

on:
  push:
    paths:
      - "research/cyse_01608/**"
      - ".github/workflows/cyse-01608.yml"
  pull_request:
    paths:
      - "research/cyse_01608/**"
      - ".github/workflows/cyse-01608.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference-study:
    name: Regression tests and 720-condition matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned standalone study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/cyse_01608/requirements.txt
      - name: Run research regression tests
        run: python -m pytest -q research/cyse_01608/tests
      - name: Execute complete independent 720-condition reference matrix
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("artifacts/cyse_01608")
          manifest = json.loads((p / "manifest.json").read_text())
          with (p / "runs.csv").open(newline="") as f:
              n = sum(1 for _ in csv.DictReader(f))
          assert n == 720, n
          assert manifest["run_count"] == 720
          assert manifest["total_rounds"] == 14400
          print(f"Verified independent matrix: {n} runs / {manifest['total_rounds']} rounds")
          PY
      - name: Execute malicious-client protocol-bypass extension
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608_bypass --attacker-compliance bypass --aggregators mean median multi_krum --privacy-modes clip_only dp_1 dp_2 --threats benign sign_flip
          python research/cyse_01608/security_analysis.py --compliant artifacts/cyse_01608/paired.csv --bypass artifacts/cyse_01608_bypass/paired.csv --output artifacts/cyse_01608_bypass/security_comparison.csv
      - name: Execute non-IID extension (not part of submitted matrix)
        run: |
          python research/cyse_01608/reproduce.py --output artifacts/cyse_01608_non_iid --partition dirichlet --alpha 0.3 --aggregators mean median multi_krum --privacy-modes clip_only dp_1 --threats benign sign_flip
      - name: Execute crossed security sensitivity smoke grid
        run: |
          python research/cyse_01608/stress_matrix.py --output artifacts/cyse_01608_stress --datasets breast_cancer --seeds 0 1 --partitions iid dirichlet --alphas 0.3 --malicious-clients 1 3 --aggregators mean median --privacy-modes clip_only dp_1 --threats sign_flip --attacker-compliance compliant bypass --rounds 5
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/cyse_01608_stress/stress_manifest.json").read_text())
          assert m["scenarios"] == 64
          assert m["executed_runs"] == 128
          assert m["total_rounds"] == 640
          PY
      - name: Upload independent results (not original manuscript data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyse-01608-independent-reference
          path: |
            artifacts/cyse_01608/
            artifacts/cyse_01608_bypass/
            artifacts/cyse_01608_non_iid/
            artifacts/cyse_01608_stress/
          if-no-files-found: ignore
          retention-days: 30
