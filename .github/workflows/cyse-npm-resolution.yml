name: Resolve dashboard vulnerability fixes (temporary)

on:
  push:
    branches: [research/cyse-01608-reproducibility]
    paths:
      - .github/workflows/cyse-npm-resolution.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Resolve patched dashboard dependencies and regenerate package lock
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact --ignore-scripts --no-fund next@16.4.5
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          echo '__CYSE_NPM_PACKAGE_START__'
          cat package.json
          echo '__CYSE_NPM_PACKAGE_END__'
          echo '__CYSE_NPM_LOCK_START__'
          cat package-lock.json
          echo '__CYSE_NPM_LOCK_END__'
      - name: Typecheck patched Next.js dashboard
        working-directory: frontend
        run: npm run typecheck
