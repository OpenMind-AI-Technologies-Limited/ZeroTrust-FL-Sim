name: Research dependency lockfile repair evidence

on:
  pull_request:
    paths:
      - '.github/workflows/research-lockfile-repair.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

permissions:
  contents: read

jobs:
  resolve-lockfile:
    if: github.head_ref == 'research/ztfl-cyse-security-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Produce patched dependency lockfile
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=16.4.5
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --omit=dev --audit-level=high || true
          echo 'RESEARCH_PACKAGE_JSON_BASE64_BEGIN'
          base64 -w0 package.json
          echo
          echo 'RESEARCH_PACKAGE_JSON_BASE64_END'
          echo 'RESEARCH_LOCKFILE_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'RESEARCH_LOCKFILE_BASE64_END'
      - name: Validate resolved lockfile with clean install
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund
          npm run typecheck
          npm audit --omit=dev --audit-level=high
