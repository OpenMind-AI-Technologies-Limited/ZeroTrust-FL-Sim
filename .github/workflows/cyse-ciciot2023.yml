name: CYSE-01608 Modern 2023 IoT External Validity

on:
  push:
    branches: [research/cyse-01608-reproducibility]
    paths:
      - "research/cyse_01608/modern_iot_data.py"
      - "research/cyse_01608/tests/test_modern_iot_data.py"
      - "research/cyse_01608/defense_benchmark.py"
      - "research/cyse_01608/reproduce.py"
      - "research/cyse_01608/robust_baselines.py"
      - ".github/workflows/cyse-ciciot2023.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-matched-study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Pin scientific/HF dataset dependencies
        run: |
          python -m pip install -r research/cyse_01608/requirements.txt
          python -m pip install "datasets==4.4.1"
      - name: Reject synthetic source leakage and validate original design
        run: python -m pytest -q research/cyse_01608/tests/test_modern_iot_data.py research/cyse_01608/tests/test_reproduce.py
      - name: Obtain pinned 2023 IoT-source subsample and independently held-out validation split
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python research/cyse_01608/modern_iot_data.py --output data/iot --revision ae15e93
      - name: Execute 5-seed FLTrust and existing-byzantine comparators
        run: |
          python research/cyse_01608/defense_benchmark.py \
            --dataset CICIoT2023 \
            --train data/iot/train.csv --test data/iot/validation.csv \
            --output evidence/modern_iot \
            --methods mean multi_krum rfa fltrust \
            --privacy clip_only dp_1 --policies compliant bypass \
            --attacks sign_flip alie_oracle \
            --seeds 0 1 2 3 4 --rounds 20 \
            --train-limit 6000 --test-limit 3000 \
            --trusted-root-fraction 0.05
      - name: Fail-closed paired statistical and source audit
        run: |
          python research/cyse_01608/attack_sensitivity_validation.py \
            --input-dir evidence/modern_iot --output-dir evidence/modern_iot_audit --draws 4000
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          s=json.loads(Path("data/iot/snapshot_manifest.json").read_text())
          assert s["source_dataset"]=="lacg030175/CIC-IoT-2023"
          assert s["version_sha"].startswith("ae15e93")
          assert s["no_duplicate_feature_vectors_within_or_across_splits"]
          assert set(s["class_counts_train"].values())=={3000}
          assert set(s["class_counts_holdout"].values())=={1500}
          manifest=json.loads(Path("evidence/modern_iot/baseline_manifest.json").read_text())
          audit=json.loads(Path("evidence/modern_iot_audit/audit_manifest.json").read_text())
          assert len(manifest["dataset_split_manifests"])==5
          assert manifest["executions"]==240 and manifest["federated_rounds"]==4800
          assert audit["per_seed_effects"]==80 and audit["contrasts"]==26
          assert manifest["trusted_root_fraction"]==0.05
          with Path("evidence/modern_iot/baseline_runs.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==240
          assert {r["dataset"] for r in rows}=={"CICIoT2023"}
          assert {int(r["trusted_root_rows"]) for r in rows}=={300}
          print("Valid modern historical IoT derivative evidence; NOT original corpus nor group-held-out proof")
          PY
      - name: Preserve result CSVs + source release identity; not copyrighted source samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyse-01608-ciciot2023-fixed-subset
          path: |
            evidence/modern_iot/
            evidence/modern_iot_audit/
            data/iot/snapshot_manifest.json
          if-no-files-found: ignore
          retention-days: 30
